{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/adminpanel.css' %}">
{% endblock css %}

{% block content %}

<div class="admin-container">
    <div class="admin-header">
        <h1>Reject Listings</h1>
        <p>You are about to reject: <strong>{{ room.title }}</strong>.</p>
    </div>

    <div class="reject-form-box">
        <form method="POST">
            {% csrf_token %}
            <label for="reason">Rejection Reason</label>
            <textarea id="reason" name="reason" rows="4" placeholder="Enter reason for rejection"></textarea>
            <button type="submit" class="btn-reject">Reject Listing</button>
        </form>
    </div>
</div>

{% endblock content %}
